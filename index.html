<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霓虹尘埃 · 苏苏工作室</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f7f5f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            color: #666;
        }
        .card { padding: 40px; }
        p { margin: 12px 0; font-size: 0.95em; }
        a { color: #8b5e3c; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .loader { display: inline-block; width: 20px; height: 20px; border: 2px solid #e0dbd5; border-top-color: #8b5e3c; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>
        window.location.href = 'https://deadlyjoker.github.io/novel-apocalypse/';
    </script>
</head>
<body>
    <div class="card">
        <div class="loader"></div>
        <p>正在跳转到苏苏工作室·书架...</p>
        <p>若未自动跳转，<a href="https://deadlyjoker.github.io/novel-apocalypse/">请点击这里</a></p>
    </div>
</body>
</html>
