                    <div class="meta">点击加载章节内容</div>

        // 切换卷
        function showVol(v) {
            document.getElementById('vtab1').className = v === 1 ? 'active' : '';
            document.getElementById('vtab2').className = v === 2 ? 'active' : '';
            document.getElementById('vol1-list').className = v === 1 ? 'chapter-list active' : 'chapter-list';
            document.getElementById('vol2-list').className = v === 2 ? 'chapter-list active' : 'chapter-list';
        }

        // 加载章节
        async function loadChapter(vol, id) {
            const arr = vol === 1 ? vol1 : vol2;
            const chapter = arr.find(c => c.id === id);
            if (!chapter) return;

            const contentEl = document.getElementById('chapter-content');
            document.getElementById('vol1-list').className = 'chapter-list';
            document.getElementById('vol2-list').className = 'chapter-list';
            contentEl.innerHTML = '<div class="loading">📖 加载中...</div>';

            setTimeout(() => contentEl.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);

            try {
                const resp = await fetch(chapter.file);
                if (!resp.ok) throw new Error('加载失败');
                const md = await resp.text();
                const html = marked.parse(md);

                // 上一章/下一章
                const idx = arr.findIndex(c => c.id === id);
                const prevId = idx > 0 ? arr[idx - 1].id : null;
                const nextId = idx < arr.length - 1 ? arr[idx + 1].id : null;

                contentEl.innerHTML = `
                    <div class="chapter active">
                        <h2>${chapter.title}</h2>
                        ${html}
                        <div class="chapter-nav">
                            <a href="#" class="${prevId === null ? 'disabled' : ''}" onclick="loadChapter(${vol}, ${prevId}); return false;">← 上一章</a>
                            <a href="#" onclick="showVol(${vol}); scrollTo(0,0); return false;">返回目录</a>
                            <a href="#" class="${nextId === null ? 'disabled' : ''}" onclick="loadChapter(${vol}, ${nextId}); return false;">下一章 →</a>
                        </div>
                    </div>
                `;
            } catch (e) {
                contentEl.innerHTML = `<div class="error">❌ 加载失败：${e.message}</div>`;
            }
        }

        // 初始化
        renderV1();
        renderV2();
        showVol(1);

        // 更新时间
        document.getElementById('update-time').textContent = '最后更新：' + new Date().toLocaleString('zh-CN', {timeZone:'Asia/Shanghai'});

        console.log('霓虹尘埃页面已加载，章节:', vol1.length, '卷1 +', vol2.length, '卷2');
