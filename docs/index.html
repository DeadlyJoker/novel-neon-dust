<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>苏苏工作室 · 书架</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#f7f5f0;color:#333;min-height:100vh;
}
.container{max-width:600px;margin:0 auto;padding:40px 20px}
h1{font-size:1.6em;font-weight:600;margin-bottom:8px;color:#1a1a1a}
.sub{color:#999;font-size:0.9em;margin-bottom:32px}
.book{
  display:block;text-decoration:none;
  background:white;border-radius:12px;padding:24px;margin-bottom:16px;
  box-shadow:0 1px 4px rgba(0,0,0,0.06);transition:box-shadow 0.2s;
}
.book:hover{box-shadow:0 4px 16px rgba(0,0,0,0.1)}
.book-title{font-size:1.15em;font-weight:600;color:#1a1a1a;margin-bottom:6px}
.book-meta{font-size:0.85em;color:#999}
.book-desc{font-size:0.9em;color:#666;margin-top:8px;line-height:1.6}
.empty{text-align:center;color:#999;padding:60px 20px;font-size:0.95em}
footer{text-align:center;color:#bbb;font-size:0.8em;padding:40px 20px}

@media (prefers-color-scheme:dark){
  body{background:#1a1a1d;color:#ddd}
  h1{color:#eee}
  .book{background:#252528;box-shadow:0 1px 4px rgba(0,0,0,0.2)}
  .book:hover{box-shadow:0 4px 16px rgba(0,0,0,0.3)}
  .book-title{color:#eee}
  .book-desc{color:#aaa}
}
</style>
</head>
<body>
<div class="container">
<h1>苏苏工作室 · 书架</h1>
<p class="sub">AI 辅助创作 · 精工细作</p>
<div id="book-list"></div>
</div>
<footer>苏苏工作室 &copy; 2026</footer>
<script>
var BOOKS = [
  {
    id: "neon-dust",
    title: "霓虹尘埃",
    author: "苏苏工作室",
    desc: "赛博朋克世界，底层黑市义体医生林深，为救妹妹一步步向上爬，每一步都以牺牲珍视之物为代价。",
    chapters: 133,
    words: "连载中 · 第二卷更新至第53章",

    url: "reader.html?book=neon-dust"
  },
  {
    id: "apocalypse",
    title: "末日进化：基因王座",
    author: "苏苏工作室",
    desc: "红雨降临，基因觉醒。秦烈从废墟中崛起，一路杀上基因王座。",
    chapters: 39,
    words: "约43万字",
    url: "reader.html?book=apocalypse"
  }
];

var html = '';
BOOKS.forEach(function(b){
  html += '<a class="book" href="'+b.url+'">';
  html += '<div class="book-title">'+b.title+'</div>';
  html += '<div class="book-meta">'+b.chapters+'章 · '+b.words+' · '+b.author+'</div>';
  html += '<div class="book-desc">'+b.desc+'</div>';
  html += '</a>';
});
document.getElementById('book-list').innerHTML = html || '<div class="empty">书架上还没有书</div>';
</script>
</body>
</html>
